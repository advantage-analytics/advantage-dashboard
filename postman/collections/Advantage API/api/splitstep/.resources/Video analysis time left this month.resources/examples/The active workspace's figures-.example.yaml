$kind: http-example
name: The active workspace's figures.
request:
  url: "{{baseUrl}}/api/splitstep/hours-left"
  method: GET
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Per-workspace figures that go stale with every upload.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "workspaceId": "0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a",
        "remainingSeconds": 1200,
        "capSeconds": 7200,
        "bandFull": false
      }
order: 1000
