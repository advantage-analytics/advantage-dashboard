$kind: http-example
name: The caller holds no workspace the match belongs to, the upload contract refuses the row, the workspace's video allowance is not open to this caller (`explainVideoRefusal()`), or the admin-console video check threw.
request:
  url: "{{baseUrl}}/api/splitstep/upload-url"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "matchId": "5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b",
        "fileName": "spring-open-r16.mp4"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "You do not have access to the workspace this match belongs to."
      }
order: 4000
