$kind: http-example
name: "Try again: the roster or program status could not be read, or Azure storage is not configured on this deployment."
request:
  url: "{{baseUrl}}/api/splitstep/upload-url"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "matchId": "5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b",
        "fileName": "spring-open-r16.mp4"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "We couldn't load Stanford Women's Tennis's roster. Try again."
      }
order: 9000
