$kind: http-example
name: "Admin console only: the blob name could not be recorded on the operation's job. (For an ordinary upload that failure is logged and the URL is still returned.)"
request:
  url: "{{baseUrl}}/api/splitstep/upload-url"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "matchId": "5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b",
        "fileName": "spring-open-r16.mp4"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Could not reserve the video upload"
      }
order: 6000
