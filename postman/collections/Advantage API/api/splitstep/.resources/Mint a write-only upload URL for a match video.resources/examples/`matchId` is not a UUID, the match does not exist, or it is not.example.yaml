$kind: http-example
name: "`matchId` is not a UUID, the match does not exist, or it is not the caller's. Indistinguishable on purpose."
request:
  url: "{{baseUrl}}/api/splitstep/upload-url"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "matchId": "5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b",
        "fileName": "spring-open-r16.mp4"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "No such match"
      }
order: 5000
