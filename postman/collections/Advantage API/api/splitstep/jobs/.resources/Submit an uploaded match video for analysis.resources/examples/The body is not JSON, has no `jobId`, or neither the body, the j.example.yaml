$kind: http-example
name: The body is not JSON, has no `jobId`, or neither the body, the job row nor the match row records which player starts at the top of the frame (refused, never defaulted).
request:
  url: "{{baseUrl}}/api/splitstep/jobs"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "jobId": "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f",
        "initialTopPlayerIsPlayer1": true,
        "adScoring": true,
        "fixedCamera": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Invalid JSON body"
      }
order: 2000
