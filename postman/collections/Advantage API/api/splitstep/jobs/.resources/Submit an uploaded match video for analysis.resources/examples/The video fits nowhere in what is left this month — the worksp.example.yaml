$kind: http-example
name: The video fits nowhere in what is left this month — the workspace's own allowance or, for an individual, the shared beta band. Waiting for the month to roll over (or a shorter trim) changes the answer.
request:
  url: "{{baseUrl}}/api/splitstep/jobs"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "jobId": "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f",
        "initialTopPlayerIsPlayer1": true,
        "adScoring": true,
        "fixedCamera": true
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "This match needs 1 hr 35 min of analysis but only 20 min is left in your monthly allowance (2 hr). It resets at the start of next month; a shorter trim will fit sooner.",
        "usedSeconds": 6000,
        "capSeconds": 7200
      }
order: 8000
