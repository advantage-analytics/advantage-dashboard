$kind: http-example
name: "Try again: analysis is not configured on this deployment, the roster or program status could not be read, the claim write failed, the reservation RPC gave no answer, or (admin console only) the vendor accepted the job but its `queued` status could not be saved."
request:
  url: "{{baseUrl}}/api/splitstep/jobs"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "jobId": "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f",
        "initialTopPlayerIsPlayer1": true,
        "adScoring": true,
        "fixedCamera": true
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Analysis is not configured on this deployment."
      }
order: 11000
