$kind: http-example
name: The reservation was refused (`quota`) — for the manual path, the allowance is spent or not open to this caller. The child row is removed. Unlike `/api/splitstep/jobs`, a permission refusal here is also 429, and the body carries no figures.
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/resubmit"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "This match needs 1 hr 35 min of analysis but only 20 min is left in your monthly allowance (2 hr). It resets at the start of next month; a shorter trim will fit sooner.",
        "reason": "quota"
      }
order: 7000
