$kind: http-example
name: "The match cannot be rebuilt into a vendor request (`invalid_metadata`): it could not be read, it has no orientation answer, or the builder refused it."
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/resubmit"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "This match is missing its camera-orientation answer and cannot be retried automatically.",
        "reason": "invalid_metadata"
      }
order: 6000
