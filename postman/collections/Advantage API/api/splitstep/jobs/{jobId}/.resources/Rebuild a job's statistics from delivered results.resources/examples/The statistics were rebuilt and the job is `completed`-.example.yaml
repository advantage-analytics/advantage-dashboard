$kind: http-example
name: The statistics were rebuilt and the job is `completed`.
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/rederive"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "jobId": "3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f",
        "status": "completed"
      }
order: 1000
