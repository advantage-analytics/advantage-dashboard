$kind: http-example
name: The job could not be read, the claim write failed, or the rebuild itself failed — the row is then back at `derivation_failed` and the body says so.
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/rederive"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Could not load the job"
      }
order: 5000
