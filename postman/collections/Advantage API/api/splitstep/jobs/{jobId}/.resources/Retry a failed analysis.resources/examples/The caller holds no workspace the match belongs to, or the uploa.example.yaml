$kind: http-example
name: The caller holds no workspace the match belongs to, or the upload contract refuses the row (`not_eligible`).
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/resubmit"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "You do not have access to the workspace this match belongs to."
      }
order: 3000
