$kind: http-example
name: "`submit_failed`: the retry history, the live-job check or the child insert failed, or the vendor refused the POST (the child is then marked `failed` and its reservation handed back)."
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/resubmit"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 502
  statusText: Bad Gateway
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Could not submit the retry to the analysis provider.",
        "reason": "submit_failed"
      }
order: 9000
