$kind: http-example
name: "Try again: the match read failed (answered by the route, before any billing workspace is chosen), analysis is not configured (`not_configured`), the reservation RPC gave no answer (`quota_unavailable`), or the roster or program status could not be read (`eligibility_unknown`)."
request:
  url: "{{baseUrl}}/api/splitstep/jobs/:jobId/resubmit"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: jobId
      value: <uuid>
      disabled: false
      description: (Required) A `processing_jobs` id. A value that is not a UUID answers 404 "Job not found", the same as a missing job or someone else's.
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Could not load the match. Try again."
      }
order: 10000
