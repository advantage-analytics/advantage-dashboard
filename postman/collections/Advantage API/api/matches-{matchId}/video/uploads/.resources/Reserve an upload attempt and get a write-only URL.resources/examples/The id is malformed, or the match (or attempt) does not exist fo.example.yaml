$kind: http-example
name: The id is malformed, or the match (or attempt) does not exist for this caller. Absent and invisible are the same answer.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video/uploads"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: json
    content: |-
      {
        "filename": "spring-open-r16.mp4",
        "sizeBytes": 2147483648,
        "contentType": "video/mp4",
        "clientRequestId": "3f2e1d0c-9b8a-4765-8432-10fedcba9876",
        "expectedActive": null
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "This match is not available.",
        "code": "match_not_found",
        "detail": "not_visible"
      }
order: 6000
