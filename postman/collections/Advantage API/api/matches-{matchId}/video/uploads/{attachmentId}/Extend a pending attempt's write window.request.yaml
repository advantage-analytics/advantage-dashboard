$kind: http-request
description: Re-signs the same staged key with a later expiry. Nothing about the attempt may change, so the body is absent or `{}`. Refused for an active or retired row, and while a completion holds the attempt.
url: "{{baseUrl}}/api/matches/:matchId/video/uploads/:attachmentId/renew"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: matchId
    value: <uuid>
    disabled: false
    description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  - key: attachmentId
    value: <uuid>
    disabled: false
    description: (Required) The upload attempt's id, as returned by the reservation. A value that is not a UUID answers 404 `match_not_found`.
body:
  type: json
  content: <object>
settings: {}
examples: ./.resources/Extend a pending attempt's write window.resources/examples
order: 2000
