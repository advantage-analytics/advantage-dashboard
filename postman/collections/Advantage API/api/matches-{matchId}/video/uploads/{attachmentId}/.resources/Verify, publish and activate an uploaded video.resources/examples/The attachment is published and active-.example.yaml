$kind: http-example
name: The attachment is published and active.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video/uploads/:attachmentId/complete"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
    - key: attachmentId
      value: <uuid>
      disabled: false
      description: (Required) The upload attempt's id, as returned by the reservation. A value that is not a UUID answers 404 `match_not_found`.
  body:
    type: json
    content: |-
      {
        "confirmedVideoTimeSeconds": 63.5,
        "expectedActive": null
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "committed",
        "attachment": {
          "id": "9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b",
          "version": 1,
          "offsetSeconds": -41.25,
          "confirmedVideoTimeSeconds": 63.5,
          "durationSeconds": 5421.04,
          "contentType": "video/mp4",
          "filename": "spring-open-r16.mp4"
        }
      }
order: 1000
