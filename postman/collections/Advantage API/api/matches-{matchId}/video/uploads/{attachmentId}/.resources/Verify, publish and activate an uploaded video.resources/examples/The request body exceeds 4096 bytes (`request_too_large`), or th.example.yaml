$kind: http-example
name: The request body exceeds 4096 bytes (`request_too_large`), or the video is 8 GB or more (`file_too_large`) or empty (`empty_file`).
request:
  url: "{{baseUrl}}/api/matches/:matchId/video/uploads/:attachmentId/complete"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
    - key: attachmentId
      value: <uuid>
      disabled: false
      description: (Required) The upload attempt's id, as returned by the reservation. A value that is not a UUID answers 404 `match_not_found`.
  body:
    type: json
    content: |-
      {
        "confirmedVideoTimeSeconds": 63.5,
        "expectedActive": null
      }
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "This request is too large.",
        "code": "request_too_large",
        "detail": "content_length"
      }
order: 8000
