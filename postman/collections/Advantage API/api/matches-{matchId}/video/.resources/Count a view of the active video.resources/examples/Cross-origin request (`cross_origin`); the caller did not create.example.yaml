$kind: http-example
name: Cross-origin request (`cross_origin`); the caller did not create the match or it is not a SwingVision import (`forbidden`); or the active workspace is not the match's own (`workspace_mismatch`).
request:
  url: "{{baseUrl}}/api/matches/:matchId/video/viewed"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "This request must come from the app.",
        "code": "cross_origin",
        "detail": "origin_not_allowed"
      }
order: 3000
