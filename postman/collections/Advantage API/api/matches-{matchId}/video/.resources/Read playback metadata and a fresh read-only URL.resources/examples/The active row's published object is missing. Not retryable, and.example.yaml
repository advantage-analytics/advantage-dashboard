$kind: http-example
name: The active row's published object is missing. Not retryable, and not "no video" — the row is still active.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video"
  method: GET
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "The video changed. Reload and try again.",
        "code": "stale_attachment",
        "detail": "final_object_missing"
      }
order: 4000
