$kind: http-example
name: A bug or unexpected database answer on the server side.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video"
  method: DELETE
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: json
    content: |-
      {
        "attachmentId": "7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Something went wrong on our side. Try again in a moment.",
        "code": "internal_error",
        "detail": "unhandled"
      }
order: 8000
