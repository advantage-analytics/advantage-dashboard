$kind: http-example
name: Cross-origin request, or the caller neither uploaded this video nor is an owner or coach of the match's program.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video"
  method: DELETE
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: json
    content: |-
      {
        "attachmentId": "7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "This request must come from the app.",
        "code": "cross_origin",
        "detail": "origin_not_allowed"
      }
order: 4000
