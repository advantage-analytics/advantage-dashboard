$kind: http-example
name: The attachment is not in a state removal accepts.
request:
  url: "{{baseUrl}}/api/matches/:matchId/video"
  method: DELETE
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: json
    content: |-
      {
        "attachmentId": "7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "The video changed. Reload and try again.",
        "code": "mode_conflict",
        "detail": "attempt_retired"
      }
order: 6000
