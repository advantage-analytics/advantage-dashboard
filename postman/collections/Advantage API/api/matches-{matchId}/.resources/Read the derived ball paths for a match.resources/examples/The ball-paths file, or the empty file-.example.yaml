$kind: http-example
name: The ball-paths file, or the empty file.
request:
  url: "{{baseUrl}}/api/matches/:matchId/ball-paths"
  method: GET
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "version": 1,
        "strokes": [
          {
            "contactTime": 12.48,
            "bounceTime": 13.02,
            "path": [
              [
                12.48,
                1.2,
                -10.9,
                0.95
              ],
              [
                12.58,
                1.4,
                -6.1,
                1.62
              ],
              [
                13.02,
                2.1,
                4.3,
                0
              ]
            ]
          }
        ]
      }
order: 1000
