$kind: http-example
name: The admin console's purge guard protects this match.
request:
  url: "{{baseUrl}}/api/matches/:matchId"
  method: DELETE
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Matches recorded or analyzed through the admin console cannot be deleted here."
      }
order: 4000
