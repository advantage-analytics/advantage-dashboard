$kind: http-example
name: The match is gone.
request:
  url: "{{baseUrl}}/api/matches/:matchId"
  method: DELETE
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: matchId
      value: <uuid>
      disabled: false
      description: (Required) The match's id. A value that is not a UUID answers 404, never 400.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ok": true
      }
order: 1000
