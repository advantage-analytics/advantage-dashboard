$kind: http-example
name: No session.
request:
  url: "{{baseUrl}}/api/admin/uploads/file"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        description: (Required) The SwingVision .xlsx export.
      - type: text
        key: operationId
        value: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        description: "(Required) "
      - type: text
        key: itemId
        value: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
        description: "(Required) "
      - type: text
        key: programId
        value: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
        description: "(Required) "
      - type: text
        key: playerId
        value: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        description: ""
      - type: text
        key: date
        value: 2026-09-12
        description: ""
      - type: text
        key: matchType
        value: Singles
        description: " (This can only be one of Singles,Doubles)"
