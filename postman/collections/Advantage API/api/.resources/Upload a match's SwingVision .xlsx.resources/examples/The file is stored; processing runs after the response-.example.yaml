$kind: http-example
name: The file is stored; processing runs after the response.
request:
  url: "{{baseUrl}}/api/upload"
  method: POST
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: text
        key: matchId
        value: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
        description: "(Required) "
      - type: text
        key: providerId
        value: swing-vision
        description: (Required) An import provider. Only `swing-vision` is one today.
      - type: file
        key: file
        src: ""
        contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        description: (Required) The SwingVision .xlsx export, under 50 MB.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "fileId": "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d",
        "storagePath": "0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a/5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b/match.xlsx"
      }
order: 1000
