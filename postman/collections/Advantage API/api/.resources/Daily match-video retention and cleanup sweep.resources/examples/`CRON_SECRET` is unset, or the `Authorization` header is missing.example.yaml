$kind: http-example
name: "`CRON_SECRET` is unset, or the `Authorization` header is missing, not a bearer, empty or wrong. One body for every cause."
request:
  url: "{{baseUrl}}/api/cron/cleanup-match-videos"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "ok": false,
        "error": "unauthorized"
      }
order: 2000
