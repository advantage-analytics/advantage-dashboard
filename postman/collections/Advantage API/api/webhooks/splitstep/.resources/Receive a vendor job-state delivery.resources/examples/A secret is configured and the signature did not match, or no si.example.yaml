$kind: http-example
name: A secret is configured and the signature did not match, or no signature header was sent and `SPLITSTEP_WEBHOOK_ALLOW_UNSIGNED` is not `true`. One body for every cause; the reason is a server log line.
request:
  url: "{{baseUrl}}/api/webhooks/splitstep"
  method: POST
  headers:
    - key: x-hmac-signature
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "job_id": "ss-job-81f2c0",
        "event": "job_completed",
        "status": "completed",
        "strokes_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/strokes.json?sv=2025-01-05&sp=r&sig=REDACTED",
        "players_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/players.json?sv=2025-01-05&sp=r&sig=REDACTED",
        "trajectories_url": null,
        "trimmed_video_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/trimmed.mp4?sv=2025-01-05&sp=r&sig=REDACTED"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Unauthorized"
      }
order: 3000
