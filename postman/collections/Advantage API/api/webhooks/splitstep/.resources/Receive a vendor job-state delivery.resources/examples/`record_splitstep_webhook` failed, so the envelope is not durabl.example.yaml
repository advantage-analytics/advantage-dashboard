$kind: http-example
name: "`record_splitstep_webhook` failed, so the envelope is not durable. The record call is idempotent, so a redelivery costs nothing."
request:
  url: "{{baseUrl}}/api/webhooks/splitstep"
  method: POST
  headers:
    - key: x-hmac-signature
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "job_id": "ss-job-81f2c0",
        "event": "job_completed",
        "status": "completed",
        "strokes_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/strokes.json?sv=2025-01-05&sp=r&sig=REDACTED",
        "players_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/players.json?sv=2025-01-05&sp=r&sig=REDACTED",
        "trajectories_url": null,
        "trimmed_video_url": "https://vendor.blob.core.windows.net/results/ss-job-81f2c0/trimmed.mp4?sv=2025-01-05&sp=r&sig=REDACTED"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Failed to record delivery"
      }
order: 4000
