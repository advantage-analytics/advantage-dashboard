$kind: http-example
name: The plan update failed.
request:
  url: "{{baseUrl}}/api/webhooks/stripe"
  method: POST
  headers:
    - key: Stripe-Signature
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "evt_1Q2w3E4r5T6y7U8i",
        "object": "event",
        "type": "checkout.session.completed",
        "data": {
          "object": {
            "id": "cs_test_a1B2c3D4",
            "object": "checkout.session",
            "client_reference_id": "0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a",
            "metadata": {
              "user_id": "0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a"
            }
          }
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Failed to update user plan"
      }
order: 4000
