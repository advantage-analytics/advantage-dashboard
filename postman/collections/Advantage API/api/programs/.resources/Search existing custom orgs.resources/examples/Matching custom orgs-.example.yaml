$kind: http-example
name: Matching custom orgs.
request:
  url: "{{baseUrl}}/api/programs/custom-search?q=centennial&type=club"
  method: GET
  headers:
    - key: sb-pouxujkhtbvkdwbzfvka-auth-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    q: centennial
    type: club
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Cache-Control
      value: string
      disabled: false
      description: Every answer carries a credential or is per-caller, so none is cacheable.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "results": [
          {
            "programId": "2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a",
            "name": "Centennial Tennis Club",
            "orgType": "club",
            "ownerDisplay": "Elena V."
          }
        ]
      }
order: 1000
