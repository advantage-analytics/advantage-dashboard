<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Customer matches list, pending and verified</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #ffffff;
          }
        </style>
      </helmet>
      <div
        style="
          width: 880px;
          height: 340px;
          box-sizing: border-box;
          padding: 40px 48px;
          background: #ffffff;
          color: #0d0d0d;
          font-family: Inter, system-ui, sans-serif;
          -webkit-font-smoothing: antialiased;
          font-size: 13px;
          line-height: 1.45;
        "
      >
        <h1
          style="
            margin: 0 0 20px;
            font-size: 30px;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -0.01em;
          "
        >
          Matches
        </h1>
        <div
          style="
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 130px 220px;
            column-gap: 16px;
            padding: 0 12px 10px;
            border-bottom: 1px solid #f3f3f3;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6b6b76;
          "
        >
          <span>Date</span><span>Opponent</span><span>Score</span
          ><span>Status</span>
        </div>
        <div
          style="
            height: 56px;
            padding: 0 12px;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 130px 220px;
            align-items: center;
            column-gap: 16px;
          "
        >
          <span style="font-size: 12px; color: #6b6b76">Nov 12</span
          ><span>V. Petrov</span
          ><span style="font-variant-numeric: tabular-nums">7-6 &nbsp;6-3</span>
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 12px;
              color: #525252;
            "
            ><img
              src="/_blob/8dc400743f71ee0897f4461b274b65d4"
              alt=""
              style="
                width: 14px;
                height: 14px;
                filter: grayscale(1);
                opacity: 0.55;
              "
            />Verification pending</span
          >
        </div>
        <div
          style="
            height: 56px;
            padding: 0 12px;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 130px 220px;
            align-items: center;
            column-gap: 16px;
          "
        >
          <span style="font-size: 12px; color: #6b6b76">Nov 10</span
          ><span>N. Fields</span
          ><span style="font-variant-numeric: tabular-nums"
            >4-6 &nbsp;6-3 &nbsp;3-6</span
          >
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 12px;
              color: #525252;
            "
            ><img
              src="/_blob/8dc400743f71ee0897f4461b274b65d4"
              alt=""
              style="
                width: 14px;
                height: 14px;
                filter: grayscale(1);
                opacity: 0.55;
              "
            />Verification pending</span
          >
        </div>
        <div
          style="
            height: 56px;
            padding: 0 12px;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 130px 220px;
            align-items: center;
            column-gap: 16px;
          "
        >
          <span style="font-size: 12px; color: #6b6b76">Nov 6</span
          ><span>H. Diallo</span
          ><span style="font-variant-numeric: tabular-nums">6-2 &nbsp;6-2</span>
          <span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 12px;
              color: #525252;
            "
            ><img
              src="/_blob/8dc400743f71ee0897f4461b274b65d4"
              alt=""
              style="width: 14px; height: 14px"
            />Verified by Advantage</span
          >
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":880,"height":340}}'
    >
      class Component extends DCLogic {
      renderVals() { return {}; }
      }
    </script>
  </body>
</html>
