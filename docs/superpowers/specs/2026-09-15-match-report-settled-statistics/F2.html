<div id="F2" data-screen-label="Settled F2" style="display:flex;flex-direction:column;gap:9px;width:868px">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="#F2" style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-button);background:var(--ink-900);color:#FFFFFF;font:500 11px var(--font-sans)">
      F2
    </a>
    <span style="font:500 12px var(--font-sans);color:var(--ink-900)">
      Insight — default
    </span>
    <span style="font-size:11px;color:var(--ink-500)">
      claim, evidence, credit and both exits
    </span>
  </div>
  <div style="width:868px;padding:20px;background:var(--surface-page);border-radius:var(--radius-card)">
    <div class="ins-c" style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px 18px 12px;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:15px;font-weight:300;line-height:1.35;color:var(--ink-900);max-width:62ch;text-wrap:pretty">
        The serve, not the rally, decided the second set.
      </span>
      <span style="font-size:12px;line-height:1.65;color:var(--ink-600);max-width:86ch;text-wrap:pretty">
        Reid won
        <span class="tabular">
          78%
        </span>
        of first-serve points but landed only
        <span class="tabular">
          54%
        </span>
        of them. In set 2 that fell to
        <span class="tabular" style="color:var(--ink-900)">
          46%
        </span>
        — the points were lost before the rally started.
        <span role="button" tabindex="0" style="display:inline;font-size:11px;font-weight:500;color:var(--blue);cursor:pointer;white-space:nowrap">
          Why this
          <i data-lucide="arrow-up-right" stroke-width="1.5" style="display:inline-block;vertical-align:-1px;width:12px;height:12px;margin-left:3px">
          </i>
        </span>
      </span>
      <div style="display:flex;align-items:center;gap:7px;padding-top:8px;border-top:1px solid var(--border-hairline)">
        <span style="width:16px;height:16px;flex:0 0 16px;border-radius:3px;background:var(--ink-900);display:flex;align-items:center;justify-content:center">
          <img src="assets/logo-mark.svg" alt="" style="width:9px;height:6px;display:block;filter:brightness(0) invert(1)">
        </span>
        <span class="text-micro" style="color:var(--ink-500)">
          Advantage Intelligence
        </span>
        <div style="flex:1">
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span role="button" tabindex="0" style="font-size:11px;font-weight:500;color:var(--ink-500);cursor:pointer;white-space:nowrap" style-hover="color:var(--ink-900)">
            Dismiss
          </span>
          <span role="button" tabindex="0" aria-label="Collapse" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;border-radius:var(--radius-element);cursor:pointer;color:var(--ink-400)" style-hover="background:var(--surface-subtle);color:var(--ink-700)">
            <i data-lucide="chevron-up" stroke-width="1.5" style="width:14px;height:14px">
            </i>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
