<div id="F3" data-screen-label="Settled F3" style="display:flex;flex-direction:column;gap:9px;width:868px">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="#F3" style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-button);background:var(--ink-900);color:#FFFFFF;font:500 11px var(--font-sans)">
      F3
    </a>
    <span style="font:500 12px var(--font-sans);color:var(--ink-900)">
      Insight — collapsed
    </span>
    <span style="font-size:11px;color:var(--ink-500)">
      Show is the only blue; Dismiss stays reachable
    </span>
  </div>
  <div style="width:868px;padding:20px;background:var(--surface-page);border-radius:var(--radius-card)">
    <div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-card);height:44px;padding:0 18px;display:flex;align-items:center;gap:10px">
      <span style="width:16px;height:16px;flex:0 0 16px;border-radius:3px;background:var(--ink-900);display:flex;align-items:center;justify-content:center">
        <img src="assets/logo-mark.svg" alt="" style="width:9px;height:6px;display:block;filter:brightness(0) invert(1)">
      </span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink-700)">
        The serve, not the rally, decided the second set.
      </span>
      <span role="button" tabindex="0" style="font-size:11px;font-weight:500;color:var(--blue);cursor:pointer;white-space:nowrap" style-hover="color:var(--blue-hover)">
        Show
      </span>
      <span style="width:1px;height:14px;background:var(--border-hairline);margin:0 2px">
      </span>
      <span role="button" tabindex="0" style="font-size:11px;font-weight:500;color:var(--ink-500);cursor:pointer;white-space:nowrap" style-hover="color:var(--ink-900)">
        Dismiss
      </span>
    </div>
  </div>
</div>
