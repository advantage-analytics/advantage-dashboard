                $ref: "#/components/schemas/HoursLeft"
              examples:
                personal:
                  summary: An individual with time left
                  value:
                    workspaceId: 0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a
                    remainingSeconds: 1200
                    capSeconds: 7200
                    bandFull: false
                bandFull:
                  summary: The shared beta band ran out first
                  value:
                    workspaceId: 0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a
                    remainingSeconds: 0
                    capSeconds: 7200
                    bandFull: true
        "401":
