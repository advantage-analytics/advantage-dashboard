  /api/webhooks/splitstep:
    get:
      tags: [Webhooks]
      operationId: splitstepWebhookLiveness
      summary: Liveness check for the vendor webhook URL
      description: >-
        Lets the endpoint URL be confirmed reachable before anything is
        wired. Unauthenticated, and says nothing a holder of the URL does not
        already know.
      security: []
      responses:
        "200":
          description: The endpoint is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitstepWebhookLiveness"
              example:
                endpoint: splitstep-webhook
                status: ready
                method: POST
    post:
      tags: [Webhooks]
      operationId: receiveSplitstepWebhook
      summary: Receive a vendor job-state delivery
      description: >-
        The Advantage Intelligence vendor POSTs here when a job changes state
        (`job_queued`, `job_processing`, `job_completed`, `job_failed`). The
        shape is verify → record → 200 → everything else in `after()`: the
        vendor has a 30 s timeout and no retry policy, so the only work before
        the answer is recording the envelope, which is what makes the rest
        recoverable by hand.


        **Authentication** (`webhook-auth.ts`). With
        `SPLITSTEP_WEBHOOK_SECRET` set the endpoint fails closed: the
        signature (`x-hmac-signature`, see `splitstepHmac`) must match, and a
        delivery with no signature header is refused too — unless
        `SPLITSTEP_WEBHOOK_ALLOW_UNSIGNED=true`, the pilot escape hatch, which
        accepts it recorded `signature_verified = false`. A header carrying
        the raw shared secret instead of an HMAC is accepted but recorded
        unverified. With no secret configured at all the endpoint is open and
        logs a warning on every delivery.


        A delivery that matches no job is still recorded and answers 200 — a
        retry would orphan identically.
      security:
        - splitstepHmac: []
      requestBody:
        required: true
        description: >-
          Read as raw bytes and verified before any parsing; the HMAC is over
          exactly these bytes. Any body is recorded verbatim — a non-JSON or
          unrecognised one yields null fields, never a refusal.
          `parseWebhookPayload()` matches field names with case and
          punctuation ignored and walks nested objects.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitstepWebhookPayload"
            examples:
              completed:
                summary: job_completed (September 2026 API)
                value:
                  job_id: ss-job-81f2c0
                  event: job_completed
                  status: completed
                  strokes_url: https://vendor.blob.core.windows.net/results/ss-job-81f2c0/strokes.json?sv=2025-01-05&sp=r&sig=REDACTED
                  players_url: https://vendor.blob.core.windows.net/results/ss-job-81f2c0/players.json?sv=2025-01-05&sp=r&sig=REDACTED
                  trajectories_url: null
                  trimmed_video_url: https://vendor.blob.core.windows.net/results/ss-job-81f2c0/trimmed.mp4?sv=2025-01-05&sp=r&sig=REDACTED
              failed:
                summary: job_failed with a structured error
                value:
                  job_id: ss-job-81f2c0
                  event: job_failed
                  status: failed
                  error:
                    code: INTERNAL_ERROR
                    category: internal
                    step: downloading_video
                    message: We could not download the video. Please try again.
      responses:
        "200":
          description: >-
            The delivery is recorded. Results download, grading, derivation,
            quota release and any automatic retry run after this answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitstepWebhookAck"
              example:
                received: true
                deliveryId: 6e7f8a9b-0c1d-4e2f-8a3b-4c5d6e7f8a9b
        "400":
          description: The request body could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unreadable body
        "401":
          description: >-
            A secret is configured and the signature did not match, or no
            signature header was sent and `SPLITSTEP_WEBHOOK_ALLOW_UNSIGNED`
            is not `true`. One body for every cause; the reason is a server
            log line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "500":
          description: >-
            `record_splitstep_webhook` failed, so the envelope is not durable.
            The record call is idempotent, so a redelivery costs nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Failed to record delivery

  /api/webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: receiveStripeWebhook
      summary: Receive a Stripe event
      description: >-
        Verifies the `Stripe-Signature` header against
        `STRIPE_WEBHOOK_SECRET` over the raw body, then acts on
        `checkout.session.completed` only: the user named by
        `metadata.user_id` (or `client_reference_id`) is moved to Pro. Every
        other event type answers 200 untouched. Kept after checkout was
        retired, for receipts and any checkout already open. The module
        throws at load when `STRIPE_WEBHOOK_SECRET` is unset, so on such a
        deployment every request fails before this handler runs.
      security:
        - stripeSignature: []
      requestBody:
        required: true
        description: A Stripe `Event` object, verified as raw bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
            example:
              id: evt_1Q2w3E4r5T6y7U8i
              object: event
              type: checkout.session.completed
              data:
                object:
                  id: cs_test_a1B2c3D4
                  object: checkout.session
                  client_reference_id: 0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a
                  metadata:
                    user_id: 0e9a2b7c-4d1f-4a8e-9b3c-2f1e0d9c8b7a
      responses:
        "200":
          description: The event was handled, or needed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeWebhookAck"
              examples:
                handled:
                  value:
                    received: true
                alreadyPro:
                  summary: The user was already on Pro
                  value:
                    received: true
                    message: Already Pro
        "400":
          description: >-
            No `Stripe-Signature` header, a signature that does not verify
            (the Stripe SDK's message follows `Webhook Error: `), or a
            completed checkout with no user id on it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noSignature:
                  value:
                    error: No signature
                badSignature:
                  value:
                    error: "Webhook Error: No signatures found matching the expected signature for payload."
                noUser:
                  value:
                    error: No user ID
        "404":
          description: The session's user id names no `users` row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: User not found
        "500":
          description: The plan update failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Failed to update user plan

  /api/cron/cleanup-match-videos:
    get:
      tags: [Cron]
      operationId: runMatchVideoCleanup
      summary: Daily match-video retention and cleanup sweep
      description: >-
        Scheduled by `vercel.json` at 05:00 UTC. Expires videos a year
        unwatched, warns those 30 days from it, then sweeps retired and
        abandoned attachments out of storage. The bearer check runs first and
        fails closed: an unset or blank `CRON_SECRET` refuses every request,
        and no step — nor the service-role client — runs until it matches.
        The three steps are independent: a failed expire or warn step is
        reported as a 500 but the sweep still runs. A 200 can still count
        rows that failed and were backed off.
      security:
        - cronBearer: []
      responses:
        "200":
          description: Every step ran.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupCronBody"
              example:
                ok: true
                reason: cron
                expired: 1
                warned: 2
                emailed: 2
                claimed: 4
                outcomes:
                  cleaned_up: 3
                  staged_shed: 0
                  rescheduled: 1
                  lease_lost: 0
                  version_changed: 0
                  failed: 0
                  unsettled: 0
                rpcFailures: 0
                durationMs: 1843
        "401":
          description: >-
            `CRON_SECRET` is unset, or the `Authorization` header is missing,
            not a bearer, empty or wrong. One body for every cause.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupCronError"
              example:
                ok: false
                error: unauthorized
        "500":
          description: >-
            The sweep threw (`cleanup_failed`, no counts), or it ran but the
            batch claim was refused (`claim_failed`) or the expire or warn
            step threw (`expiry_failed` / `warning_failed`) — those three
            carry the full report beside `error`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CleanupCronError"
                  - $ref: "#/components/schemas/CleanupCronFailedRun"
              examples:
                sweepThrew:
                  value:
                    ok: false
                    error: cleanup_failed
                warnFailed:
                  value:
                    ok: false
                    reason: cron
                    expired: 0
                    warned: 0
                    emailed: 0
                    claimed: 2
                    outcomes:
                      cleaned_up: 2
                      staged_shed: 0
                      rescheduled: 0
                      lease_lost: 0
                      version_changed: 0
                      failed: 0
                      unsettled: 0
                    rpcFailures: 0
                    durationMs: 912
                    error: warning_failed

  /api/home-insight:
    post:
      tags: [Insights]
      operationId: streamHomeInsight
      summary: Stream the personal Focus card's claim line
      description: >-
        One sentence of at most eight words, no digits, streamed as plain
        text from `getLLMStream()`. Every figure the prompt uses is
        recomputed server-side for the signed-in player; no body is read.
        Answers 204 when the player has no matches, rather than inventing a
        claim. A stream that fails after the first byte errors the body, not
        the status.
      responses:
        "200":
          $ref: "#/components/responses/InsightStream"
        "204":
          description: No matches recorded, so there is nothing to claim.
        "401":
          $ref: "#/components/responses/TextUnauthorized"
        "500":
          $ref: "#/components/responses/InsightLlmError"

  /api/team-insight:
    post:
      tags: [Insights]
      operationId: streamTeamInsight
      summary: Stream Team Home's Focus card claim line
      description: >-
        Team Home's counterpart to `/api/home-insight`, about the ACTIVE team
        workspace's squad rather than the viewer. Same contract: one
        sentence, plain-text stream, 204 when there is no analysed dual
        match or no insight to make. The program comes from the workspace
        cookie through `getWorkspaceContext()`; no body is read.
      responses:
        "200":
          $ref: "#/components/responses/InsightStream"
        "204":
          description: No analysed dual match this season, so there is nothing to claim.
        "401":
          $ref: "#/components/responses/TextUnauthorized"
        "404":
          description: The active workspace is personal, which has no squad.
          content:
            text/plain:
              schema:
                type: string
              example: Not a program
        "500":
          $ref: "#/components/responses/InsightLlmError"

  /api/admin/uploads/file:
    get:
      tags: [Admin uploads]
      operationId: getAdminMatchFileStatus
      summary: Read an admin-console file submission's durable status
      description: >-
        Admin only (`users.is_admin`), and only for an operation this admin
        started. The wizard reads it after a submit whose answer was lost.
      parameters:
        - name: operationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        - name: itemId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
      responses:
        "200":
          $ref: "#/components/responses/AdminFileStatus"
        "400":
          description: The ids are malformed, the operation is not this admin's, or nothing was submitted for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefusal"
              examples:
                invalid:
                  value:
                    ok: false
                    message: Invalid operation.
                unavailable:
                  value:
                    ok: false
                    message: This operation is unavailable.
                none:
                  value:
                    ok: false
                    message: No file has been submitted for this operation yet.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [Admin uploads]
      operationId: submitAdminMatchFile
      summary: Submit a SwingVision .xlsx from the admin console
      description: >-
        Validates and parses the workbook, stores it under
        `_admin-console/{operationId}/{itemId}/{sha256}.xlsx` (never
        overwritten), records it through `admin_submit_match_file` and, when
        the attempt is `queued`, dispatches `process-match`. Players, score
        and actor come from the file and the session, never the form. Either
        a prepared match (`matchId` + `fingerprint`) or a new one (`playerId`,
        `date`, `matchType`, `courtType`). Retry-safe on the same operation
        and file. Answers the durable status, as GET does.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminFileSubmitRequest"
            encoding:
              file:
                contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            example:
              file: (binary)
              operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
              itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
              programId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
              playerId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              date: "2026-09-12"
              matchType: Singles
              courtType: Outdoor Hard Court
      responses:
        "200":
          $ref: "#/components/responses/AdminFileStatus"
        "400":
          description: >-
            An unknown or repeated form field, a malformed id, a workbook that
            fails validation or parsing, or a refusal from
            `admin_submit_match_file`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefusal"
              examples:
                fields:
                  value:
                    ok: false
                    message: Invalid file submission.
                ids:
                  value:
                    ok: false
                    message: Provide a valid program, operation, athlete or prepared match, and file.
                players:
                  value:
                    ok: false
                    message: The export needs named players and complete numeric set scores.
                existing:
                  summary: Refused by the RPC (existing-analysis)
                  value:
                    ok: false
                    message: This match already has analysis or an attached file.
                store:
                  value:
                    ok: false
                    message: Could not store this file safely. Retry with the same file and operation.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          description: >-
            The handler threw after the file may already have been stored and
            recorded. The wizard matches this exact sentence and checks the
            operation's status (GET) before any retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefusal"
              example:
                ok: false
                message: Submission response was interrupted. Check this operation before retrying with the same file.

  /api/admin/uploads/video:
    post:
      tags: [Admin uploads]
      operationId: submitAdminMatchVideo
      summary: Reserve an admin-console match video for analysis
      description: >-
        Admin only. Validates the trim window and the three vendor answers,
        builds the vendor request to prove it would be accepted, and reserves
        the operation through `admin_submit_match_video`, which returns the
        match and job the upload then targets (`/api/splitstep/upload-url`,
        then `/api/splitstep/jobs`). For a prepared match (`matchId` +
        `fingerprint`) the players, score and details come from the recorded
        match and must not be sent; otherwise `playerId`, `opponentName`,
        `score`, `date`, `courtType` and `bestOf` describe a new singles
        match. Unknown keys are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVideoSubmitRequest"
            examples:
              newMatch:
                summary: A new singles match
                value:
                  operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                  itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
                  programId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
                  playerId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  opponentName: Sam Chen
                  score:
                    player1: [6, 6]
                    player2: [3, 4]
                  date: "2026-09-12"
                  courtType: Outdoor Hard Court
                  bestOf: 3
                  startSeconds: 42.5
                  endSeconds: 5224.5
                  initialTopPlayerIsPlayer1: true
                  adScoring: true
                  fixedCamera: true
              preparedMatch:
                summary: A recorded match, identified by its fingerprint
                value:
                  operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                  itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
                  programId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
                  matchId: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
                  fingerprint: 0f1e2d3c4b5a69788796a5b4c3d2e1f0
                  startSeconds: 42.5
                  endSeconds: 5224.5
                  initialTopPlayerIsPlayer1: false
                  adScoring: false
                  fixedCamera: true
      responses:
        "200":
          description: The operation holds a match and a job to upload into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVideoSubmitted"
              example:
                ok: true
                operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
                matchId: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
                jobId: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
        "400":
          description: >-
            The body is not a JSON object, a field is missing, unknown or
            malformed, the program is not this admin's or not active, the
            match or score is unusable, the vendor request builder refused
            it, or the reservation RPC did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefusal"
              examples:
                body:
                  value:
                    ok: false
                    message: Invalid video submission.
                fields:
                  value:
                    ok: false
                    message: Provide a valid operation, program, trim window and all three video answers.
                replacements:
                  value:
                    ok: false
                    message: An attachment uses the recorded players, score and match details. Do not supply replacements.
                inactive:
                  value:
                    ok: false
                    message: This program must be active before submitting video.
                reserve:
                  value:
                    ok: false
                    message: Could not reserve this video.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"

  /api/create-checkout-session:
    post:
      tags: [Billing]
      operationId: createCheckoutSession
      summary: Retired Pro checkout
      deprecated: true
      description: >-
        Retired 2026-09-25: nothing is sold during the beta. Always answers
        410, before any session is read, so an old tab or a hand-made request
        cannot buy the old Pro plan. `/api/webhooks/stripe` stays.
      security: []
      responses:
        "410":
          description: Checkout is retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Advantage is free during the beta, so there is nothing to buy right now.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb-pouxujkhtbvkdwbzfvka-auth-token
      description: >-
        The Supabase Auth session cookie set by `@supabase/ssr`, named
        `sb-<project-ref>-auth-token` (the production project ref is shown;
        another project uses its own). A large session is split into
        `.0`, `.1`, … chunks. `src/proxy.ts` refreshes it on every request.

    cronBearer:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <CRON_SECRET>`, as Vercel Cron sends it. The
        scheme word is matched case-insensitively; the credential is compared
        as SHA-256 digests (`authorizeCronRequest()` in
        `src/lib/services/match-video/cleanup-schedule.ts`). An unset or blank
        `CRON_SECRET` refuses every request.
    splitstepHmac:
      type: apiKey
      in: header
      name: x-hmac-signature
      description: >-
        `base64(HMAC-SHA256(SPLITSTEP_WEBHOOK_SECRET, raw_body))`, computed
        over the exact bytes received (`verifyWebhookAuth()` in
        `src/lib/services/splitstep/webhook-auth.ts`). Also looked for, as a
        hedge, under `x-splitstep-signature`, `x-webhook-signature`,
        `x-signature`, `x-signature-256`, `x-hub-signature-256`, `signature`,
        `x-webhook-secret`, `x-api-key` and `authorization` (a `Bearer `
        prefix is stripped). Every one of those headers is redacted before
        the delivery is recorded.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: >-
        Stripe's webhook signature, verified by
        `stripe.webhooks.constructEvent()` against `STRIPE_WEBHOOK_SECRET`
        over the raw body.

  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      description: The match's id. A value that is not a UUID answers 404, never 400.
      schema:
        type: string
        format: uuid
      example: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: >-
        The upload attempt's id, as returned by the reservation. A value that
        is not a UUID answers 404 `match_not_found`.
      schema:
        type: string
        format: uuid
      example: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b

    JobId:
      name: jobId
      in: path
      required: true
      description: >-
        A `processing_jobs` id. A value that is not a UUID answers 404 "Job
        not found", the same as a missing job or someone else's.
      schema:
        type: string
        format: uuid
      example: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f

  headers:
    CacheControlPrivate:
      description: Every answer carries a credential or is per-caller, so none is cacheable.
      schema:
        type: string
        const: private, no-store
    RetryAfter:
      description: Seconds to wait before re-sending the same completion request.
      schema:
        type: integer
        minimum: 1
      example: 2

    CacheControlNoStore:
      description: Per-workspace figures that go stale with every upload.
      schema:
        type: string
        const: no-store

  requestBodies:
    NoMetadata:
      description: >-
        None of these endpoints takes a field. `Content-Type:
        application/json` is still required (it makes the request one a
        browser preflights); the body must be absent or `{}`, and any key is
        refused with 400 `invalid_request`.
      required: false
      content:
        application/json:
          schema:
            type: object
            maxProperties: 0
          example: {}

  responses:
    PlainUnauthorized:
      description: No session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Unauthorized
    PlainNotFound:
      description: >-
        The id is not a UUID, the match does not exist, or it is not the
        caller's. The three are indistinguishable on purpose.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Not found
    LegacyUnauthorized:
      description: No session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyErrorResponse"
          example:
            success: false
            error: Unauthorized
    VideoInvalidRequest:
      description: >-
        The request never reached the attachment domain: a non-JSON content
        type, an unreadable or malformed body, a body that is not an object,
        or a missing, mistyped or unexpected field. `detail` names the cause.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequest"
    VideoUnauthenticated:
      description: No session.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            unauthenticated:
              $ref: "#/components/examples/Unauthenticated"
    VideoMutationForbidden:
      description: >-
        Cross-origin request (`cross_origin`); the caller did not create the
        match or it is not a SwingVision import (`forbidden`); or the active
        workspace is not the match's own (`workspace_mismatch`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            crossOrigin:
              $ref: "#/components/examples/CrossOrigin"
            forbidden:
              $ref: "#/components/examples/Forbidden"
            workspaceMismatch:
              $ref: "#/components/examples/WorkspaceMismatch"
    VideoMatchNotFound:
      description: >-
        The id is malformed, or the match (or attempt) does not exist for this
        caller. Absent and invisible are the same answer.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            matchNotFound:
              $ref: "#/components/examples/MatchNotFound"
    VideoAttemptConflict:
      description: >-
        The attempt is active or retired (`mode_conflict`), or a completion
        currently holds it (`pending_attempt_conflict`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            modeConflict:
              $ref: "#/components/examples/ModeConflict"
            pendingAttempt:
              $ref: "#/components/examples/PendingAttemptConflict"
    VideoRequestTooLarge:
      description: The body exceeds 4096 bytes, by `Content-Length` or as streamed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            requestTooLarge:
              $ref: "#/components/examples/RequestTooLarge"
    VideoFileTooLarge:
      description: >-
        The request body exceeds 4096 bytes (`request_too_large`), or the
        video is 8 GB or more (`file_too_large`) or empty (`empty_file`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            requestTooLarge:
              $ref: "#/components/examples/RequestTooLarge"
            fileTooLarge:
              $ref: "#/components/examples/FileTooLarge"
            emptyFile:
              $ref: "#/components/examples/EmptyFile"
    VideoInternalError:
      description: A bug or unexpected database answer on the server side.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            internalError:
              $ref: "#/components/examples/InternalError"
    VideoStorageUnavailable:
      description: >-
        The database or video storage could not be asked. Retryable — the
        match may well exist.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlPrivate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoErrorResponse"
          examples:
            storageUnavailable:
              $ref: "#/components/examples/StorageUnavailable"

    SplitstepNotSignedIn:
      description: No session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Not signed in
    SplitstepJobNotFound:
      description: >-
        The id is not a UUID, the job does not exist, or it is not the
        caller's. Indistinguishable on purpose.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Job not found
    QuotaExhausted:
      description: >-
        The video fits nowhere in what is left this month — the workspace's
        own allowance or, for an individual, the shared beta band. Waiting
        for the month to roll over (or a shorter trim) changes the answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaRefusalResponse"
          examples:
            account:
              summary: The workspace's own allowance
              value:
                error: This match needs 1 hr 35 min of analysis but only 20 min is left in your monthly allowance (2 hr). It resets at the start of next month; a shorter trim will fit sooner.
                usedSeconds: 6000
                capSeconds: 7200
            openBeta:
              summary: The open-beta ceiling
              value:
                error: This month's free beta video analysis is fully booked. It reopens at the start of next month, and you can still import SwingVision matches in the meantime.
                usedSeconds: 360000
                capSeconds: 360000
    TextUnauthorized:
      description: No session.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    InsightStream:
      description: >-
        The claim line, streamed as it is generated. The body is one sentence
        of plain text with no markup, sent as `text/plain; charset=utf-8` by
        `textStreamResponse()`.
      content:
        text/plain:
          schema:
            type: string
          example: Second serves are deciding your losses.
    InsightLlmError:
      description: The LLM adapter could not start a stream.
      content:
        text/plain:
          schema:
            type: string
          example: LLM error
    AdminUnauthenticated:
      description: No session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRefusal"
          example:
            ok: false
            message: Administrator access is required.
    AdminForbidden:
      description: Signed in, but `users.is_admin` is not true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRefusal"
          example:
            ok: false
            message: Administrator access is required.
    AdminFileStatus:
      description: The operation's durable file-attempt status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminFileStatus"
          examples:
            queued:
              summary: Stored, not yet processing
              value:
                ok: true
                operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
                matchId: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
                fileId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                state: queued
                retryable: true
                message: File saved. Retry this operation with the same file to start processing.
            completed:
              value:
                ok: true
                operationId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                itemId: 9b0c1d2e-3f4a-4b6c-9d7e-8f9a0b1c2d3e
                matchId: 5b0f4c1e-8a7d-4b43-9f7e-1c2d3e4f5a6b
                fileId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                state: completed
                retryable: false
                message: Analysis completed.

  examples:
    Unauthenticated:
      summary: unauthenticated
      value:
        error: Sign in to continue.
        code: unauthenticated
        detail: no_session
    MatchNotFound:
      summary: match_not_found
      value:
        error: This match is not available.
        code: match_not_found
        detail: not_visible
    CrossOrigin:
      summary: cross_origin
      value:
        error: This request must come from the app.
        code: cross_origin
        detail: origin_not_allowed
    Forbidden:
      summary: forbidden
      value:
        error: Only the person who added this match can change its video.
        code: forbidden
        detail: not_creator
    WorkspaceMismatch:
      summary: workspace_mismatch
      value:
        error: Switch to this match's workspace to change its video.
        code: workspace_mismatch
        detail: match_in_other_program
    InvalidRequest:
      summary: invalid_request
      value:
        error: This request is not valid.
        code: invalid_request
        detail: "unexpected_field:offsetSeconds"
    RequestTooLarge:
      summary: request_too_large
      value:
        error: This request is too large.
        code: request_too_large
        detail: content_length
    StaleAttachment:
      summary: stale_attachment
      value:
        error: The video changed. Reload and try again.
        code: stale_attachment
        detail: final_object_missing
    PendingAttemptConflict:
      summary: pending_attempt_conflict
      value:
        error: Another video upload for this match is already in progress.
        code: pending_attempt_conflict
        detail: finalizing
    ModeConflict:
      summary: mode_conflict
      value:
        error: The video changed. Reload and try again.
        code: mode_conflict
        detail: attempt_retired
    AttachmentLimitReached:
      summary: attachment_limit_reached
      value:
        error: This workspace has reached its match video limit. You can still replace a match's existing video.
        code: attachment_limit_reached
        detail: workspace_at_limit
    FileTooLarge:
      summary: file_too_large
      value:
        error: This video is too large. Choose a file under 8 GB.
        code: file_too_large
        detail: size_over_limit
    EmptyFile:
      summary: empty_file
      value:
        error: This file is empty. Choose a video file.
        code: empty_file
        detail: size_not_positive
    UnsupportedMedia:
      summary: unsupported_media
      value:
        error: This video cannot be played. Export it as an MP4 with H.264 video and try again.
        code: unsupported_media
        detail: extension
    MediaProbeBudget:
      summary: media_probe_budget
      value:
        error: This video cannot be played. Export it as an MP4 with H.264 video and try again.
        code: media_probe_budget
        detail: total_bytes_limit
    InvalidAlignment:
      summary: invalid_alignment
      value:
        error: Enter a time inside this video, as hh:mm:ss.sss.
        code: invalid_alignment
        detail: confirmed_time_malformed
    MissingSourceTiming:
      summary: missing_source_timing
      value:
        error: This match is missing the timing data needed to align a video.
        code: missing_source_timing
        detail: no_points
    InsufficientCoverage:
      summary: insufficient_coverage
      value:
        error: This video is not long enough.
        code: insufficient_coverage
        detail: coverage_past_end
    StorageUnavailable:
      summary: storage_unavailable
      value:
        error: Video storage is unavailable right now. Try again in a moment.
        code: storage_unavailable
        detail: match_read_failed
    InternalError:
      summary: internal_error
      value:
        error: Something went wrong on our side. Try again in a moment.
        code: internal_error
        detail: unhandled

    NoBillingWorkspace:
      summary: The caller holds no workspace the match belongs to
      value:
        error: You do not have access to the workspace this match belongs to.
    AthleteNotOnRoster:
      summary: The athlete on the row is not on the program's roster
      value:
        error: That player isn't on Stanford Women's Tennis's roster, so the match can't be recorded for them.
    PendingApproval:
      summary: The program's claim is still under review
      value:
        error: Your team is still being confirmed. Video analysis opens as soon as it is; SwingVision imports work now.
    AnalysisNotConfigured:
      summary: Vendor settings missing on this deployment
      value:
        error: Analysis is not configured on this deployment.
    RosterUnknown:
      summary: The roster read failed, so the contract could not decide
      value:
        error: We couldn't load Stanford Women's Tennis's roster. Try again.

  schemas:
    ErrorResponse:
      type: object
      description: >-
        The error envelope. `error` is the sentence a client may show; `code`
        is the stable slug a client branches on (video routes only); `detail`
        is a cause slug for logs and tests — never rendered, and a client must
        not depend on it being present.
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        detail:
          type: string
    FieldErrorResponse:
      description: An `ErrorResponse` that may name the refused field.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            field:
              type: string
              description: The body key the refusal is about.
    VideoErrorCode:
      type: string
      description: >-
        `MatchVideoErrorCode` (`src/lib/match-video/types.ts`) plus the four
        transport codes of `src/lib/services/match-video/http.ts`
        (`invalid_request`, `cross_origin`, `request_too_large`,
        `internal_error`).
      enum:
        - unauthenticated
        - match_not_found
        - forbidden
        - workspace_mismatch
        - stale_attachment
        - pending_attempt_conflict
        - mode_conflict
        - attachment_limit_reached
        - file_too_large
        - empty_file
        - unsupported_media
        - media_probe_budget
        - invalid_alignment
        - missing_source_timing
        - insufficient_coverage
        - storage_unavailable
        - invalid_request
        - cross_origin
        - request_too_large
        - internal_error
    VideoErrorResponse:
      description: An `ErrorResponse` whose `code` is always present.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [code]
          properties:
            code:
              $ref: "#/components/schemas/VideoErrorCode"
    LegacyErrorResponse:
      type: object
      description: The `/api/upload` and `/api/validate-file` error envelope.
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    Hand:
      type: string
      enum: [right, left]
    Backhand:
      type: string
      enum: [one-handed, two-handed]
    MatchScore:
      type: object
      required: [player1, player2]
      properties:
        player1:
          type: array
          description: Games per set for the player.
          items:
            type: integer
            minimum: 0
        player2:
          type: array
          description: Games per set for the opponent.
          items:
            type: integer
            minimum: 0
        player1_tiebreaks:
          type: array
          items:
            type: [integer, "null"]
        player2_tiebreaks:
          type: array
          items:
            type: [integer, "null"]
        winner:
          description: Derived from the sets on save; a stored retirement winner is kept.
          type: [string, "null"]
          enum: [player1, player2, null]
    MatchFormat:
      type: object
      properties:
        best_of:
          type: integer
          enum: [1, 3, 5]
        ad_scoring:
          type: [boolean, "null"]
        play_on_lets:
          type: [boolean, "null"]
        games_to:
          type: integer
          description: Games in a set. Absent on singles (6); 6 or 8 on a doubles line.
    Match:
      type: object
      description: The `matches` columns the Edit Match dialog reads.
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        tournament_name:
          type: [string, "null"]
        round:
          type: [string, "null"]
        date:
          type: [string, "null"]
          description: Stored as local noon, `YYYY-MM-DDT12:00:00`.
        match_type:
          type: [string, "null"]
        court_type:
          type: [string, "null"]
        player1_id:
          type: [string, "null"]
          description: An auth user id or a `program_players.id`; never normalise it.
        player1_name:
          type: [string, "null"]
        player2_name:
          type: [string, "null"]
        score:
          oneOf:
            - $ref: "#/components/schemas/MatchScore"
            - type: "null"
        private:
          type: boolean
        format:
          oneOf:
            - $ref: "#/components/schemas/MatchFormat"
            - type: "null"
        duration:
          type: [string, integer, "null"]
        player_hand:
          type: [string, "null"]
        player_backhand:
          type: [string, "null"]
        opponent_hand:
          type: [string, "null"]
        opponent_backhand:
          type: [string, "null"]
        program_id:
          type: [string, "null"]
          format: uuid
        event_entry_id:
          type: [string, "null"]
          format: uuid
        source_provider:
          type: [string, "null"]
          description: "`swing-vision`, `splitstep`, or null for a hand-scored match."
    AnalysisStatus:
      type: string
      enum:
        - uploading
        - queued
        - processing
        - deriving
        - completed
        - failed
        - derivation_failed
        - uploaded
    MatchEventContext:
      type: object
      required:
        [
          eventId,
          eventName,
          eventKind,
          slot,
          discipline,
          startsOn,
          endsOn,
          site,
          surface,
          format,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        eventKind:
          type: string
          enum: [dual, tournament]
        slot:
          type: [string, "null"]
        discipline:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        site:
          type: string
        surface:
          type: [string, "null"]
        format:
          type: [object, "null"]
          properties:
            best_of:
              type: integer
            ad_scoring:
              type: [boolean, "null"]
    MatchDetailResponse:
      type: object
      required: [match, analysis, event, canAttach]
      properties:
        match:
          $ref: "#/components/schemas/Match"
        analysis:
          description: The newest processing job's status, or null when there is none.
          oneOf:
            - type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/AnalysisStatus"
            - type: "null"
        event:
          description: The event line the match is filed under, or null.
          oneOf:
            - $ref: "#/components/schemas/MatchEventContext"
            - type: "null"
        canAttach:
          type: boolean
          description: >-
            A team match not yet on a line, in the viewed team workspace, by
            someone who may run its schedule.
    MatchPatchRequest:
      type: object
      description: >-
        Every key is optional; send only what changed. At least one editable
        key is required, or the answer is 400 "Nothing to save.". On a match
        filed under an event line, `tournament_name`, `round`, `date`,
        `match_type` and `court_type` are refused.
      minProperties: 1
      properties:
        tournament_name:
          type: [string, "null"]
        round:
          type: [string, "null"]
        date:
          type: string
          format: date
        match_type:
          type: [string, "null"]
        court_type:
          type: [string, "null"]
        player1_id:
          type: string
          description: Team matches only — a player on the program roster.
        player1_name:
          type: string
          minLength: 1
        player2_name:
          type: string
          minLength: 1
        player_hand:
          oneOf:
            - $ref: "#/components/schemas/Hand"
            - type: "null"
        opponent_hand:
          oneOf:
            - $ref: "#/components/schemas/Hand"
            - type: "null"
        player_backhand:
          oneOf:
            - $ref: "#/components/schemas/Backhand"
            - type: "null"
        opponent_backhand:
          oneOf:
            - $ref: "#/components/schemas/Backhand"
            - type: "null"
        format:
          description: Refused on an analysed or event-linked match.
          allOf:
            - $ref: "#/components/schemas/MatchFormat"
        score:
          $ref: "#/components/schemas/MatchScore"

    BallPathSample:
      type: array
      description: "`[t, x, y, z]` — video seconds and court metres."
      items:
        type: number
      minItems: 4
      maxItems: 4
    BallPathStroke:
      type: object
      required: [contactTime, bounceTime, path]
      properties:
        contactTime:
          type: number
          description: The stroke's video time; equals `shots.video_time`.
        bounceTime:
          type: [number, "null"]
        path:
          type: array
          items:
            $ref: "#/components/schemas/BallPathSample"
    BallPathsFile:
      type: object
      required: [version, strokes]
      properties:
        version:
          type: integer
          const: 1
        strokes:
          type: array
          items:
            $ref: "#/components/schemas/BallPathStroke"

    ExpectedActiveAttachment:
      description: >-
        The attachment the caller believes is active, or `null` for "this
        match has no video". The key must be present; omitting it is a 400.
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 0
        - type: "null"
    ConfirmedVideoTime:
      description: >-
        Video-clock seconds where the first point's serve contact happens, as
        a non-negative number or an `hh:mm:ss.sss` string. Rounded to
        milliseconds. A malformed value is 422 `invalid_alignment`.
      oneOf:
        - type: number
          minimum: 0
        - type: string
          pattern: "^(\\d+:){0,2}\\d+(\\.\\d+)?$"
    ActiveAttachment:
      type: object
      required:
        [
          id,
          version,
          offsetSeconds,
          confirmedVideoTimeSeconds,
          durationSeconds,
          contentType,
          filename,
        ]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          description: Increments on every alignment change.
        offsetSeconds:
          type: number
          description: The saved source-to-video shift.
        confirmedVideoTimeSeconds:
          type: number
        durationSeconds:
          type: number
          description: Server-verified duration of the published file.
        contentType:
          type: string
        filename:
          type: string
    PlaybackMetadata:
      allOf:
        - $ref: "#/components/schemas/ActiveAttachment"
        - type: object
          required: [playbackUrl, playbackExpiresAt]
          properties:
            playbackUrl:
              type: string
              format: uri
              description: Short-lived read-only SAS URL. Refresh it; never store it.
            playbackExpiresAt:
              type: string
              format: date-time
    PlaybackMetadataResult:
      type: object
      required: [attachment]
      properties:
        attachment:
          oneOf:
            - $ref: "#/components/schemas/PlaybackMetadata"
            - type: "null"
    RemoveAttachmentRequest:
      type: object
      additionalProperties: false
      required: [attachmentId]
      properties:
        attachmentId:
          type: string
          format: uuid
    RemoveAttachmentResult:
      type: object
      required: [attachmentId, state, retiredReason]
      properties:
        attachmentId:
          type: string
          format: uuid
        state:
          type: string
          const: retired
        retiredReason:
          type: [string, "null"]
          enum: [removed, expired, null]
          description: Null when the row was already retired by a replacement.
    UpdateAlignmentRequest:
      type: object
      additionalProperties: false
      required: [attachmentId, expectedVersion, confirmedVideoTimeSeconds]
      properties:
        attachmentId:
          type: string
          format: uuid
          description: The attachment the caller believes is active.
        expectedVersion:
          type: integer
          minimum: 0
        confirmedVideoTimeSeconds:
          $ref: "#/components/schemas/ConfirmedVideoTime"
    UpdateAlignmentResult:
      type: object
      required: [attachment]
      properties:
        attachment:
          $ref: "#/components/schemas/ActiveAttachment"
    ReserveUploadRequest:
      type: object
      additionalProperties: false
      required:
        [filename, sizeBytes, contentType, clientRequestId, expectedActive]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Display name; must end in .mp4, .mov, .m4v, .mkv or .webm and hold
            no path separators or control characters.
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 7999999999
          description: Declared size. Advisory — the stored blob is measured server-side.
        contentType:
          type: string
          description: A MIME type, `type/subtype`.
        clientRequestId:
          type: string
          format: uuid
          description: Client-generated; makes the reservation retry-safe.
        expectedActive:
          $ref: "#/components/schemas/ExpectedActiveAttachment"
    UploadCredential:
      type: object
      required: [attachmentId, uploadUrl, uploadExpiresAt]
      properties:
        attachmentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Write-only SAS for the staged key. Never names the final object.
        uploadExpiresAt:
          type: string
          format: date-time
    CancelUploadResult:
      type: object
      required: [attachmentId, state]
      properties:
        attachmentId:
          type: string
          format: uuid
        state:
          type: string
          const: retired
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [confirmedVideoTimeSeconds, expectedActive]
      properties:
        confirmedVideoTimeSeconds:
          $ref: "#/components/schemas/ConfirmedVideoTime"
        expectedActive:
          $ref: "#/components/schemas/ExpectedActiveAttachment"
    CompleteUploadPending:
      type: object
      required: [status, attachmentId, retryAfterSeconds]
      properties:
        status:
          type: string
          const: pending
        attachmentId:
          type: string
          format: uuid
        retryAfterSeconds:
          type: integer
          minimum: 1
    CompleteUploadCommitted:
      type: object
      required: [status, attachment]
      properties:
        status:
          type: string
          const: committed
        attachment:
          $ref: "#/components/schemas/ActiveAttachment"
    RecordViewResult:
      type: object
      required: [view]
      properties:
        view:
          oneOf:
            - type: object
              required: [attachmentId, lastViewedAt]
              properties:
                attachmentId:
                  type: string
                  format: uuid
                lastViewedAt:
                  type: string
                  format: date-time
                  description: The new start of the retention clock.
            - type: "null"

    UploadRequest:
      type: object
      required: [file, matchId, providerId]
      properties:
        file:
          type: string
          format: binary
          description: The SwingVision .xlsx export, under 50 MB.
        matchId:
          type: string
          format: uuid
        providerId:
          type: string
          description: An import provider. Only `swing-vision` is one today.
          example: swing-vision
    UploadResponse:
      type: object
      required: [success, fileId, storagePath]
      properties:
        success:
          type: boolean
          const: true
        fileId:
          type: string
        storagePath:
          type: string
    ValidateFileRequest:
      type: object
      required: [file, fileName]
      properties:
        file:
          type: string
          description: The workbook as base64, or as a base64 data URL.
        fileName:
          type: string
    ValidateFileResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: string
        validation_errors:
          type: array
          items:
            type: string
        found_sheets:
          type: array
          items:
            type: string
        required_sheets:
          type: array
          items:
            type: string
        missing_sheets:
          type: array
          items:
            type: string
        extra_sheets:
          type: array
          items:
            type: string
        message:
          type: string
        sheets_validated:
          type: array
          items:
            type: string
        total_rows:
          type: object
          additionalProperties:
            type: integer

    ProgramDirectoryRow:
      type: object
      required: [programKey, schoolName, team, division, conference, state]
      properties:
        programKey:
          type: string
        schoolName:
          type: string
        team:
          type: string
          enum: [mens, womens]
        division:
          type: [string, "null"]
        conference:
          type: [string, "null"]
        state:
          type: [string, "null"]
    ProgramSearchResult:
      description: The coach view.
      allOf:
        - $ref: "#/components/schemas/ProgramDirectoryRow"
        - type: object
          required: [status, ownerDisplay]
          properties:
            status:
              type: string
              enum: [unclaimed, claim_pending, active, suspended]
            ownerDisplay:
              type: [string, "null"]
              description: '"Coach Elena Vasquez" on a claimed row.'
    PlayerProgramRow:
      description: The redacted player view (`intent=join`).
      allOf:
        - $ref: "#/components/schemas/ProgramDirectoryRow"
        - type: object
          required: [onAdvantage]
          properties:
            onAdvantage:
              type: boolean
    ProgramSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 8
          items:
            oneOf:
              - $ref: "#/components/schemas/ProgramSearchResult"
              - $ref: "#/components/schemas/PlayerProgramRow"
    CustomOrgType:
      type: string
      enum: [club, high_school, academy, other]
    CustomProgramSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 8
          items:
            type: object
            required: [programId, name, orgType, ownerDisplay]
            properties:
              programId:
                type: string
                format: uuid
              name:
                type: string
              orgType:
                $ref: "#/components/schemas/CustomOrgType"
              ownerDisplay:
                type: [string, "null"]
                description: '"Elena V." when the owner has a name.'

    SubmitJobRequest:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
        initialTopPlayerIsPlayer1:
          type: boolean
          description: >-
            Which player is at the TOP of the frame in the video's first
            frame — camera-relative, not player1/player2 by seat. Wrong, and
            every statistic is attributed to the wrong player. Optional: when
            absent, the job row's saved answer is used, then the match row's;
            if neither has one the request is refused with 400.
        adScoring:
          type: boolean
          description: Optional; falls back to the job row, then the match's `format.ad_scoring`.
        fixedCamera:
          type: boolean
          description: Optional; falls back to the job row, then the match row.
    SubmitJobResponse:
      type: object
      required:
        [jobId, externalJobId, status, billableSeconds, usedSeconds, capSeconds]
      properties:
        jobId:
          type: string
          format: uuid
        externalJobId:
          type: string
          description: The vendor's job id; webhook deliveries are matched on it.
        status:
          type: string
          const: queued
        billableSeconds:
          type: integer
          minimum: 0
          description: The trim window, rounded up. What was reserved.
        usedSeconds:
          type: integer
          minimum: 0
          description: The billing workspace's month total after this reservation.
        capSeconds:
          type: integer
          minimum: 0
    QuotaRefusalResponse:
      description: >-
        An `ErrorResponse` carrying the figures the refusal was made on — the
        limit that said no, which for an individual may be the shared band
        rather than their own allowance.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [usedSeconds, capSeconds]
          properties:
            usedSeconds:
              type: integer
              minimum: 0
            capSeconds:
              type: integer
              minimum: 0
    JobNotAnalysableResponse:
      description: An `ErrorResponse` with the request builder's reasons.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            details:
              type: array
              items:
                type: string
    ResubmitRefusalReason:
      type: string
      description: >-
        `ResubmitRefusalReason` (`src/lib/services/splitstep/resubmit-job.ts`).
        The route's `REFUSAL_STATUS` maps each to its status: `not_found` 404;
        `not_failed`, `input_rejected`, `in_flight_duplicate`,
        `attempt_ceiling`, `already_auto_resubmitted`, `video_unavailable`
        409; `quota` 429; `quota_unavailable`, `not_configured`,
        `eligibility_unknown` 503; `invalid_metadata` 422; `submit_failed`
        502; `not_eligible` 403.
      enum:
        - not_found
        - not_failed
        - input_rejected
        - in_flight_duplicate
        - attempt_ceiling
        - already_auto_resubmitted
        - video_unavailable
        - quota
        - quota_unavailable
        - not_configured
        - invalid_metadata
        - submit_failed
        - not_eligible
        - eligibility_unknown
    ResubmitRefusalResponse:
      description: >-
        An `ErrorResponse` with the refusal's `reason`. The route's own
        refusals — sign-in, the id, the job and match reads, the billing
        workspace — carry `error` only.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/ResubmitRefusalReason"
    ResubmitJobResponse:
      type: object
      required: [jobId, externalJobId, status]
      properties:
        jobId:
          type: string
          format: uuid
          description: The NEW child job's id, not the failed one's.
        externalJobId:
          type: string
        status:
          type: string
          const: queued
    RederiveResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          const: completed
    RederiveFailedResponse:
      description: >-
        An `ErrorResponse`; a rebuild that ran and failed adds the status the
        row was settled at.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            status:
              type: string
              const: derivation_failed
    UploadUrlRequest:
      type: object
      required: [matchId, fileName]
      properties:
        matchId:
          type: string
          format: uuid
          description: A match the caller created. A value that is not a UUID answers 404.
        fileName:
          type: string
          minLength: 1
          description: >-
            Only its extension is used — it must end in .mp4, .mov, .m4v,
            .mkv or .webm, and names the blob's container.
    UploadUrlResponse:
      type: object
      required: [uploadUrl, videoObjectKey, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: >-
            Create-and-write SAS (`sp=cw`) for exactly one blob. A credential:
            never log it.
        videoObjectKey:
          type: string
          description: "`videos/{userId}/{matchId}/original.{ext}`"
        expiresAt:
          type: string
          format: date-time
    HoursLeft:
      type: object
      description: "`HoursLeft` in `src/lib/services/splitstep/quota.ts`."
      required: [workspaceId, remainingSeconds, capSeconds, bandFull]
      properties:
        workspaceId:
          type: string
          format: uuid
          description: The active workspace the figures belong to.
        remainingSeconds:
          type: integer
          minimum: 0
          description: >-
            Seconds left this month — for an individual, from the tighter of
            their own cap and the shared beta band.
        capSeconds:
          type: integer
          minimum: 0
          description: >-
            The workspace's OWN monthly figure, the ring's denominator —
            never the band's.
        bandFull:
          type: boolean
          description: True when the shared beta band, not the account, has run out.
    SplitstepWebhookLiveness:
      type: object
      required: [endpoint, status, method]
      properties:
        endpoint:
          type: string
          const: splitstep-webhook
        status:
          type: string
          const: ready
        method:
          type: string
          const: POST
    SplitstepWebhookPayload:
      type: object
      description: >-
        The vendor's job-state envelope. No field is required and none is
        refused: `parseWebhookPayload()` finds each by name (case and
        punctuation ignored, nested objects walked), so `strokes_url`,
        `strokesUrl` and `StrokesUrl` are one key. Unknown fields are kept in
        the recorded raw body.
      additionalProperties: true
      properties:
        job_id:
          type: string
          description: The vendor's job id, matched against `processing_jobs.external_job_id`.
        event:
          type: string
          description: "`job_queued`, `job_processing`, `job_completed` or `job_failed`."
        status:
          type: string
        MatchID:
          type: string
          description: Our match id, when echoed; the fallback match for an early delivery.
        strokes_url:
          type: [string, "null"]
          format: uri
          description: >-
            Short-lived SAS for the stroke-by-stroke results JSON, on
            completion. Called `sas_url` before September 2026; both are read.
        players_url:
          type: [string, "null"]
          format: uri
        trajectories_url:
          type: [string, "null"]
          format: uri
        trimmed_video_url:
          type: [string, "null"]
          format: uri
          description: Recorded on the job row; never downloaded.
        error:
          type: object
          description: The structured failure, on `job_failed`.
          properties:
            code:
              type: string
            category:
              type: string
            step:
              type: string
            message:
              type: string
              description: The vendor's end-user sentence, stored as `error_message`.
    SplitstepWebhookAck:
      type: object
      required: [received, deliveryId]
      properties:
        received:
          type: boolean
          const: true
        deliveryId:
          type: string
          description: The `splitstep_webhook_deliveries` row the envelope was recorded as.
    StripeEvent:
      type: object
      description: >-
        A Stripe `Event`. Only `checkout.session.completed` is acted on; its
        `data.object` is a Checkout Session whose `metadata.user_id` (or
        `client_reference_id`) names the user.
      required: [id, type, data]
      properties:
        id:
          type: string
        object:
          type: string
          const: event
        type:
          type: string
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
    StripeWebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          const: true
        message:
          type: string
          const: Already Pro
    CleanupOutcomes:
      type: object
      description: Rows by outcome (`CleanupRowOutcome`), every key always present.
      required:
        [
          cleaned_up,
          staged_shed,
          rescheduled,
          lease_lost,
          version_changed,
          failed,
          unsettled,
        ]
      properties:
        cleaned_up:
          type: integer
          minimum: 0
        staged_shed:
          type: integer
          minimum: 0
        rescheduled:
          type: integer
          minimum: 0
        lease_lost:
          type: integer
          minimum: 0
        version_changed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unsettled:
          type: integer
          minimum: 0
    CleanupCronBody:
      type: object
      description: "`CleanupCronBody` — counts only; no keys, no ids."
      required:
        [
          ok,
          reason,
          expired,
          warned,
          emailed,
          claimed,
          outcomes,
          rpcFailures,
          durationMs,
        ]
      properties:
        ok:
          type: boolean
        reason:
          type: string
          const: cron
        expired:
          type: integer
          minimum: 0
          description: Videos retired as `expired` this run.
        warned:
          type: integer
          minimum: 0
          description: Videos stamped as 30 days from expiry this run.
        emailed:
          type: integer
          minimum: 0
          description: Of `warned`, how many were emailed.
        claimed:
          type: integer
          minimum: 0
        outcomes:
          $ref: "#/components/schemas/CleanupOutcomes"
        rpcFailures:
          type: integer
          minimum: 0
          description: Rows whose settle the database refused (`rpc_<SQLSTATE>`).
        durationMs:
          type: integer
          minimum: 0
    CleanupCronFailedRun:
      description: A run that completed with a failed step, reported in full.
      allOf:
        - $ref: "#/components/schemas/CleanupCronBody"
        - type: object
          required: [ok, error]
          properties:
            ok:
              type: boolean
              const: false
            error:
              type: string
              enum: [claim_failed, expiry_failed, warning_failed]
    CleanupCronError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          enum: [unauthorized, cleanup_failed]
    AdminRefusal:
      type: object
      description: The admin upload routes' refusal. The status carries the kind.
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: false
        message:
          type: string
    AdminFileStatus:
      type: object
      required:
        [ok, operationId, itemId, matchId, fileId, state, retryable, message]
      properties:
        ok:
          type: boolean
          const: true
        operationId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        matchId:
          type: [string, "null"]
          format: uuid
        fileId:
          type: [string, "null"]
        state:
          type: string
          enum: [queued, processing, completed, failed]
        retryable:
          type: boolean
          description: True only while `queued` — resubmit the same file to start processing.
        message:
          type: string
    AdminFileSubmitRequest:
      type: object
      description: >-
        Each field at most once; any other field is refused. A prepared match
        sends `matchId` + `fingerprint`; a new match sends `playerId`, `date`,
        `matchType` and `courtType` instead.
      required: [file, operationId, itemId, programId]
      properties:
        file:
          type: string
          format: binary
          description: The SwingVision .xlsx export.
        operationId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{32}$"
        playerId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        matchType:
          type: string
          enum: [Singles, Doubles]
        courtType:
          type: string
          description: A court label `adminUploadCourt()` accepts, or empty.
    AdminVideoSubmitRequest:
      type: object
      additionalProperties: false
      required:
        [
          operationId,
          itemId,
          programId,
          startSeconds,
          endSeconds,
          initialTopPlayerIsPlayer1,
          adScoring,
          fixedCamera,
        ]
      properties:
        operationId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        matchId:
          type: [string, "null"]
          format: uuid
          description: A recorded singles match in this program. Requires `fingerprint`.
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{32}$"
        playerId:
          type: string
          format: uuid
          description: New match only — a roster athlete.
        opponentName:
          type: string
        score:
          type: object
          required: [player1, player2]
          properties:
            player1:
              type: array
              items:
                type: [integer, "null"]
                minimum: 0
            player2:
              type: array
              items:
                type: [integer, "null"]
                minimum: 0
            player1_tiebreaks:
              type: array
              items:
                type: [integer, "null"]
                minimum: 0
            player2_tiebreaks:
              type: array
              items:
                type: [integer, "null"]
                minimum: 0
        date:
          type: string
          format: date
        courtType:
          type: [string, "null"]
        bestOf:
          type: integer
          enum: [1, 3, 5]
        startSeconds:
          type: number
          description: Trim start, in video seconds.
        endSeconds:
          type: number
          description: Trim end, in video seconds.
        initialTopPlayerIsPlayer1:
          type: boolean
        adScoring:
          type: boolean
        fixedCamera:
          type: boolean
    AdminVideoSubmitted:
      type: object
      required: [ok, operationId, itemId, matchId, jobId]
      properties:
        ok:
          type: boolean
          const: true
        operationId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
